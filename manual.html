<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSK Studio — Manual</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#060810;--bg2:#0a0e1e;--c:#00e5ff;--g:#00ff88;--r:#e94560;--t1:#d0ddf2;--t2:#7a90b8;--t3:#4a5f82;--border:rgba(25,35,75,.5)}
body{background:var(--bg);color:var(--t1);font-family:'Inter',sans-serif;line-height:1.8;min-height:100vh}
::selection{background:rgba(0,229,255,.2);color:#fff}
header{text-align:center;padding:60px 20px 40px;border-bottom:1px solid var(--border);position:relative}
header::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,255,.15),transparent)}
.logo{font-family:'Orbitron',sans-serif;font-size:32px;font-weight:700;letter-spacing:8px;background:linear-gradient(135deg,#00e5ff,#80f0ff,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--t3);letter-spacing:4px;text-transform:uppercase}
#manualTitle{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:600;color:var(--t2);margin-top:16px;letter-spacing:1px}
.lang-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:20px}
.lang-bar button{padding:4px;background:none;border:2px solid transparent;border-radius:5px;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;line-height:0}
.lang-bar button img{width:28px;height:20px;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:transform .3s}
.lang-bar button:hover img{transform:scale(1.1)}
.lang-bar button:hover{border-color:rgba(0,229,255,.15)}
.lang-bar button.active{border-color:rgba(0,229,255,.4);box-shadow:0 0 10px rgba(0,229,255,.1)}
nav{max-width:800px;margin:30px auto;padding:0 20px}
#navGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.nav-item{display:block;padding:12px 16px;background:rgba(10,14,36,.5);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--t2);font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;letter-spacing:.5px;transition:all .3s;text-align:center}
.nav-item:hover{border-color:rgba(0,229,255,.2);color:var(--c);background:rgba(0,229,255,.03)}
.nav-item span{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--t3);display:block;margin-bottom:4px}
main{max-width:800px;margin:0 auto;padding:40px 20px 80px}
.section{margin-bottom:60px}
.section-tag{font-family:'Orbitron',sans-serif;font-size:9px;color:var(--c);letter-spacing:5px;opacity:.5;margin-bottom:6px}
.section h2{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;letter-spacing:1px;margin-bottom:6px;line-height:1.2}
.cyan{color:var(--c)}
.section-line{height:1px;background:linear-gradient(90deg,rgba(0,229,255,.12),transparent 60%);margin:12px 0 24px;border:none}
.step{margin-bottom:28px}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.2);border-radius:8px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--c);margin-right:10px;vertical-align:middle}
.step-title{font-family:'Rajdhani',sans-serif;font-size:17px;font-weight:700;letter-spacing:.3px;display:inline;vertical-align:middle}
.step p{margin-top:8px;color:var(--t2);font-size:14px;line-height:1.8}
.screenshot{margin:16px 0;padding:40px 20px;background:linear-gradient(145deg,rgba(10,14,38,.5),rgba(8,10,28,.4));border:1px dashed rgba(0,229,255,.12);border-radius:14px;text-align:center;color:var(--t3);font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:1px}
.screenshot::before{content:'📷';display:block;font-size:24px;margin-bottom:8px;opacity:.4}
.code{background:rgba(3,4,14,.9);border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--c);margin:12px 0;overflow-x:auto;line-height:1.7}
.tip{padding:14px 18px;border-radius:10px;margin:14px 0;font-size:13px;line-height:1.7}
.tip-info{background:rgba(0,229,255,.04);border:1px solid rgba(0,229,255,.12);color:var(--t2)}
.tip-warn{background:rgba(241,196,15,.04);border:1px solid rgba(241,196,15,.12);color:#d4a017}
.tip-ok{background:rgba(0,255,136,.04);border:1px solid rgba(0,255,136,.12);color:#00cc6a}
.tip-label{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.status-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
.status-table th{text-align:left;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);padding:8px 12px;border-bottom:1px solid var(--border)}
.status-table td{padding:8px 12px;border-bottom:1px solid rgba(25,35,75,.25);color:var(--t2)}
.badge{font-family:'Share Tech Mono',monospace;font-size:10px;padding:2px 8px;border-radius:4px;letter-spacing:.5px}
.badge-c{background:rgba(0,229,255,.08);color:var(--c);border:1px solid rgba(0,229,255,.15)}
.badge-g{background:rgba(0,255,136,.08);color:var(--g);border:1px solid rgba(0,255,136,.15)}
.badge-r{background:rgba(233,69,96,.08);color:var(--r);border:1px solid rgba(233,69,96,.15)}
footer{text-align:center;padding:40px 20px;border-top:1px solid var(--border);color:var(--t3);font-size:12px;font-family:'Share Tech Mono',monospace;letter-spacing:1px}
footer a{color:var(--c);text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:600px){.logo{font-size:22px;letter-spacing:4px}.section h2{font-size:21px}#navGrid{grid-template-columns:1fr 1fr}.lang-bar{gap:3px}.lang-bar button{padding:4px 8px;font-size:9px}}
</style>
</head>

const IDS = ['install','project','inject','license-steam','license-itchio','license-manual','plugins','updates','order','faq'];
let currentLang = 'es';

function setLang(lang) {
    currentLang = lang;
    document.getElementById('manualTitle').textContent = T.title[lang];
    // Lang buttons
    document.querySelectorAll('.lang-bar button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    // Nav
    const nav = document.getElementById('navGrid');
    nav.innerHTML = T.nav[lang].map((n,i) => `<a href="#${IDS[i]}" class="nav-item"><span>${String(i+1).padStart(2,'0')}</span>${n}</a>`).join('');
    // Content
    const main = document.getElementById('content');
    const sections = T.sections[lang] || T.sections.en;
    let html = '';
    sections.forEach((s, i) => {
        html += `<div class="section" id="${IDS[i]}"><div class="section-tag">${String(i+1).padStart(2,'0')}</div><h2>${s.t}</h2><hr class="section-line">`;
        if (s.steps) s.steps.forEach(st => {
            html += `<div class="step"><span class="step-num">${st.n}</span><span class="step-title">${st.t}</span>`;
            if (st.p) html += `<p>${st.p}</p>`;
            if (st.code) html += `<div class="code">${st.code.replace(/\n/g,'<br>')}</div>`;
            if (st.p2) html += `<p>${st.p2}</p>`;
            if (st.s) {
                const imgMap = {
                    'steam': 'home_steam.png', 'Steam': 'home_steam.png',
                    'Proyecto': 'project_empty.png', 'Project': 'project_empty.png', 'Projet': 'project_empty.png', 'Progetto': 'project_empty.png', 'Projekt': 'project_empty.png', 'Проект': 'project_empty.png', 'Проєкт': 'project_empty.png', 'プロジェクト': 'project_empty.png', '项目': 'project_empty.png', '프로젝트': 'project_empty.png',
                    'INJECT': 'project_injected.png', 'INYECTAR': 'project_injected.png', 'INJETAR': 'project_injected.png', 'INJECTER': 'project_injected.png', 'INJIZIEREN': 'project_injected.png', 'INIETTA': 'project_injected.png', 'ВНЕДРИТЬ': 'project_injected.png', 'ВПРОВАДИТИ': 'project_injected.png', '注入': 'project_injected.png', '주입': 'project_injected.png',
                    'Plugin Manager': 'plugins_licensed.png', 'プラグインマネージャー': 'plugins_licensed.png', '插件管理器': 'plugins_licensed.png', '플러그인 매니저': 'plugins_licensed.png',
                    'Plugins': 'plugins_licensed.png', 'Plugin': 'plugins_licensed.png', 'Плагины': 'plugins_licensed.png', 'Плагіни': 'plugins_licensed.png',
                    'Licencia': 'license_active.png', 'License': 'license_active.png', 'Licença': 'license_active.png', 'Licence': 'license_active.png', 'Lizenz': 'license_active.png', 'Licenza': 'license_active.png', 'Лицензия': 'license_active.png', 'Ліцензія': 'license_active.png', 'ライセンス': 'license_active.png', '许可证': 'license_active.png', '라이선스': 'license_active.png',
                    'Console': 'home_steam.png', 'Consola': 'home_steam.png', 'Консоль': 'home_steam.png', 'コンソール': 'home_steam.png', '控制台': 'home_steam.png', '콘솔': 'home_steam.png',
                    'itch.io': 'project_browse.png',
                    'Updates': 'updates_ok.png', 'Actualizaciones': 'updates_ok.png', 'Atualizações': 'updates_ok.png', 'Mises': 'updates_ok.png', 'Aggiornamenti': 'updates_ok.png', 'Обновления': 'updates_ok.png', 'Оновлення': 'updates_ok.png',
                    'RSK_License': 'license_active.png',
                };
                let imgFile = 'home_steam.png';
                for (const [key, val] of Object.entries(imgMap)) {
                    if (st.s.includes(key)) { imgFile = val; break; }
                }
                html += `<img src="img/${imgFile}" alt="${st.s}" style="width:100%;border-radius:12px;margin:16px 0;border:1px solid rgba(25,35,75,.4);box-shadow:0 4px 20px rgba(0,0,0,.4)">`;
            }
            html += '</div>';
        });
        if (s.table) {
            html += `<table class="status-table"><thead><tr>${s.table.h.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>`;
            s.table.rows.forEach(r => html += `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`);
            html += '</tbody></table>';
        }
        if (s.faq) s.faq.forEach(f => {
            html += `<div class="step"><span class="step-num">?</span><span class="step-title">${f[0]}</span><p>${f[1]}</p></div>`;
        });
        if (s.tip) html += `<div class="tip tip-${s.tip.type}"><div class="tip-label">${s.tip.label}</div>${s.tip.text}</div>`;
        html += '</div>';
    });
    main.innerHTML = html;
}

// Init lang bar
const bar = document.getElementById('langBar');
Object.entries(LANGS).forEach(([code, info]) => {
    const btn = document.createElement('button');
    btn.dataset.lang = code;
    btn.innerHTML = `<img src="https://flagcdn.com/28x21/${info.flag}.png" alt="${info.name}" title="${info.name}">`;
    btn.onclick = () => setLang(code);
    bar.appendChild(btn);
});
setLang('es');
</script>
